<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guess.py — number guessing game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #081412;
    --panel: #0c1c19;
    --panel-2: #0f231f;
    --line: rgba(111,255,176,0.14);
    --line-strong: rgba(111,255,176,0.32);
    --phosphor: #7CFFC4;
    --phosphor-dim: #4FA783;
    --amber: #FFB454;
    --cyan: #6FE3FF;
    --text-soft: #B9D9CC;
    --text-faint: #5C7A70;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(124,255,196,0.08), transparent 60%),
      var(--bg);
    color: var(--text-soft);
    font-family: 'JetBrains Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 6vh 20px 8vh;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: var(--phosphor-dim);
    margin-bottom: 28px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand::before, .brand::after{
    content:"";
    width:26px;
    height:1px;
    background: var(--line-strong);
  }
  .terminal{
    width:100%;
    max-width:640px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line-strong);
    border-radius:10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 60px -20px rgba(124,255,196,0.15);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    background: rgba(0,0,0,0.15);
  }
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.r{background:#FF6159;}
  .dot.y{background:#FFBD2E;}
  .dot.g{background:#28C940;}
  .filename{
    margin-left:8px;
    font-size:12.5px;
    color: var(--text-faint);
  }
  .screen{
    padding: 22px 22px 16px;
    min-height: 340px;
    display:flex;
    flex-direction:column;
  }
  .banner{
    color: var(--phosphor);
    font-size:14px;
    line-height:1.75;
    margin:0 0 4px;
  }
  .banner .dim{color: var(--text-faint);}
  .log{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
    margin: 14px 0;
    min-height: 40px;
  }
  .log-line{
    font-size:14px;
    line-height:1.6;
    opacity:0;
    animation: appear 0.25s ease forwards;
  }
  @keyframes appear{ to{ opacity:1; } }
  .log-line .prompt{ color: var(--text-faint); }
  .log-line .val{ color: #E7F6EF; }
  .log-line.hi{ color: var(--amber); }
  .log-line.lo{ color: var(--cyan); }
  .log-line.win{ color: var(--phosphor); font-weight:700; }
  .log-line.err{ color: #FF8C7A; }

  .inputrow{
    display:flex;
    align-items:center;
    gap:10px;
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:auto;
  }
  .prompt-tag{
    color: var(--phosphor);
    font-size:14px;
    white-space:nowrap;
  }
  input[type="number"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: #E7F6EF;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    caret-color: var(--phosphor);
    min-width:0;
  }
  input[type="number"]::placeholder{ color: var(--text-faint); }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .cursor{
    width:8px;height:16px;
    background: var(--phosphor);
    animation: blink 1s step-end infinite;
    flex-shrink:0;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 12px 22px 18px;
    border-top:1px solid var(--line);
    background: rgba(0,0,0,0.12);
  }
  .stat{
    font-size:12px;
    color: var(--text-faint);
    letter-spacing:0.04em;
  }
  .stat b{ color: var(--text-soft); font-weight:500; }
  .stat.range-lo b{ color: var(--cyan); }
  .stat.range-hi b{ color: var(--amber); }

  button{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    background: transparent;
    color: var(--phosphor);
    border:1px solid var(--line-strong);
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  button:hover{ background: rgba(124,255,196,0.08); border-color: var(--phosphor); }
  button:active{ transform: scale(0.97); }
  button.run{ color:#0B1210; background: var(--phosphor); border-color: var(--phosphor); font-weight:700; }
  button.run:hover{ background:#9CFFD4; }
  button:disabled{ opacity:0.35; cursor:default; }

  .hint{
    text-align:center;
    font-size:11.5px;
    color: var(--text-faint);
    margin-top:22px;
    max-width:480px;
    line-height:1.7;
  }
  .hint a{ color: var(--phosphor-dim); }

  @media (max-width: 480px){
    .screen{ padding:18px 16px 14px; min-height:300px; }
    .controls{ padding:12px 16px 16px; flex-direction:column; gap:10px; align-items:stretch; }
    .stat{ text-align:center; }
  }
</style>
</head>
<body>

<div class="brand">guess.py</div>

<div class="terminal">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="filename">python3 guess.py</span>
  </div>

  <div class="screen">
    <p class="banner">
      &gt;&gt;&gt; secret = random.randint(1, 100)<br>
      <span class="dim"># I've picked a number. Can you find it?</span>
    </p>

    <div class="log" id="log"></div>

    <div class="inputrow">
      <span class="prompt-tag" id="promptTag">guess&gt;</span>
      <input type="number" id="guessInput" placeholder="type a number, hit enter" autocomplete="off" min="1" max="100">
      <div class="cursor" id="cursor"></div>
    </div>
  </div>

  <div class="controls">
    <div style="display:flex; gap:16px;">
      <span class="stat">attempts <b id="attempts">0</b></span>
      <span class="stat range-lo">low <b id="lo">1</b></span>
      <span class="stat range-hi">high <b id="hi">100</b></span>
    </div>
    <button class="run" id="actionBtn">guess</button>
  </div>
</div>

<p class="hint">Range narrows as you play — <span id="hintText">try the midpoint first.</span></p>

<script>
  let secret = Math.floor(Math.random() * 100) + 1;
  let attempts = 0;
  let won = false;
  let lo = 1, hi = 100;

  const log = document.getElementById('log');
  const input = document.getElementById('guessInput');
  const btn = document.getElementById('actionBtn');
  const attemptsEl = document.getElementById('attempts');
  const loEl = document.getElementById('lo');
  const hiEl = document.getElementById('hi');
  const hintText = document.getElementById('hintText');
  const promptTag = document.getElementById('promptTag');

  function addLine(html, cls){
    const line = document.createElement('div');
    line.className = 'log-line' + (cls ? ' ' + cls : '');
    line.innerHTML = html;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function submit(){
    if (won) return;
    const raw = input.value.trim();
    if (raw === '' || isNaN(raw) || raw < 1 || raw > 100){
      addLine('<span class="prompt">&gt;&gt;&gt;</span> <span class="val">' + (raw || ' ') + '</span>', 'err');
      addLine('ValueError: enter a whole number from 1 to 100');
      input.value = '';
      return;
    }
    const guess = parseInt(raw, 10);
    attempts += 1;
    attemptsEl.textContent = attempts;

    addLine('<span class="prompt">&gt;&gt;&gt;</span> <span class="val">' + guess + '</span>');

    if (guess > secret){
      hi = Math.min(hi, guess - 1);
      hiEl.textContent = hi;
      addLine('too high — try lower', 'hi');
      hintText.textContent = 'narrow it down between ' + lo + ' and ' + hi + '.';
    } else if (guess < secret){
      lo = Math.max(lo, guess + 1);
      loEl.textContent = lo;
      addLine('too low — try higher', 'lo');
      hintText.textContent = 'narrow it down between ' + lo + ' and ' + hi + '.';
    } else {
      addLine('correct! found in ' + attempts + (attempts === 1 ? ' attempt' : ' attempts'), 'win');
      won = true;
      input.disabled = true;
      btn.textContent = 'play again';
      promptTag.style.color = 'var(--text-faint)';
      hintText.innerHTML = 'nice work. hit <b style="color:var(--phosphor)">play again</b> for a new number.';
    }
    input.value = '';
    if (!won) input.focus();
  }

  function reset(){
    secret = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    won = false;
    lo = 1; hi = 100;
    attemptsEl.textContent = 0;
    loEl.textContent = 1;
    hiEl.textContent = 100;
    log.innerHTML = '';
    input.disabled = false;
    btn.textContent = 'guess';
    promptTag.style.color = 'var(--phosphor)';
    hintText.textContent = 'try the midpoint first.';
    input.focus();
  }

  btn.addEventListener('click', () => { won ? reset() : submit(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  window.addEventListener('load', () => input.focus());
</script>

</body>
</html>
